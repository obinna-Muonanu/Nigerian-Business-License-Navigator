# The project's description, the Python packages it needs, and the test settings, all in one place.
#
# Install everything (including the test tools) with:   pip install -e ".[dev]"
# The website is a separate React app in frontend/, installed with npm.

[project]
name = "license-navigator"
version = "1.0.0"
description = "Navi: an AI assistant that tells Nigerian small businesses which registrations and licences they need, in what order."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # The agent framework, and the AWS library it uses to reach Bedrock.
    "strands-agents>=1.61.0",      # runs the agent loop, and gives us hooks, chat saving, summarising and streaming
    "boto3>=1.40.0",               # talks to AWS: the Bedrock models and the Titan embeddings

    # The knowledge database.
    "neo4j>=5.27.0",               # the official Neo4j driver (the graph and the vector index live in one AuraDB)

    # The app database for production. Locally, Navi uses a SQLite file and doesn't need these.
    "psycopg[binary]>=3.2.0",      # talks to Postgres, where memory and chats are kept when DATABASE_URL is set
    "psycopg-pool>=3.2.0",         # keeps a few Postgres connections open and shares them, so replies stay fast

    # Data shapes and settings.
    "pydantic>=2.9.0",             # defines and checks the shapes of tool results, the extraction form and the judge's grades
    "pydantic-settings>=2.6.0",    # reads and checks the settings in .env (see agent/config.py)
    "python-dotenv>=1.0.1",        # lets pydantic-settings read the .env file
    "PyYAML>=6.0.2",               # reads the header block at the top of each knowledge-base document

    # The API server.
    "fastapi>=0.115.0",            # the API, including streaming replies on /chat and whole replies on /invoke
    "uvicorn[standard]>=0.32.0",   # the web server that runs the FastAPI app
    "PyJWT[crypto]>=2.10.0",       # checks the Supabase sign-in pass sent with every request (see api/auth.py)
]

[project.optional-dependencies]
# Only needed to run the unit tests in tests/.
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",               # lets the tests call the API without starting a real server
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "api*", "ingestion*", "evaluation*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
