# Runs automatically on GitHub every time code is pushed or a pull request is opened, so a change that breaks
# something is caught straight away. It needs no passwords or AWS access: the unit tests use test values and a
# throwaway database, and the website check only builds the code.

name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  frontend:
    name: Website type check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
